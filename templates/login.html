{% extends "base.html" %}
{% block title %}Log in | PG Cohort{% endblock %}
{% block content %}
<div class="page-title"><p class="eyebrow">WELCOME BACK</p><h1>Log in to PG Cohort</h1><p class="muted">Access your profile, roommate matches, and booking requests.</p></div>
<form method="post" class="form-card auth-card">
  <label>Email address<input type="email" name="email" autocomplete="email" required></label>
  <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
  <button class="btn primary full" type="submit">Log in →</button>
  <p class="small-note">New here? <a href="{{ url_for('register') }}">Create an account</a>.</p>
</form>
{% endblock %}
